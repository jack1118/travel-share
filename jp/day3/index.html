<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日文第 3 課｜11/15 馬拉松日＋宅急便＋燒肉</title>
<style>
body{font-family:-apple-system,"Hiragino Sans","PingFang TC",sans-serif;margin:0;background:#faf7f2;color:#222}
header{background:#c0392b;color:#fff;padding:14px 16px}
h1{font-size:20px;margin:0}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
h2{font-size:17px;margin:22px 16px 8px;color:#c0392b}
.card{background:#fff;margin:10px 12px;padding:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zh{font-size:14px;color:#666}
.jp{font-size:26px;margin:6px 0 10px;line-height:1.3}
.kana{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.k{background:#f3ece2;border-radius:6px;padding:4px 6px;text-align:center;min-width:28px}
.k b{display:block;font-size:20px;font-weight:500}
.k i{display:block;font-size:12px;font-style:normal;color:#8a5a2b}
.k.small{background:#fde2e0}
.say{font-size:15px;margin-bottom:10px}
.btns{display:flex;gap:8px}
button{flex:1;font-size:17px;padding:12px;border:0;border-radius:10px;background:#2c3e50;color:#fff}
button.slow{background:#7f8c8d}
.tip{font-size:13px;color:#555;margin-top:8px;background:#fffbe6;padding:6px 8px;border-radius:6px}
.rules{margin:10px 12px;padding:12px 14px;background:#fff;border-radius:12px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<header><h1>日文第 3 課｜11/15 馬拉松日</h1><p>按「🐢 慢」先聽，再按「▶ 正常」，跟著念。</p></header>

<div class="rules">
<b>3 個基本規則</b><br>
① <b>片假名</b>（有稜角，例：チェックイン）用來寫外來語。<br>
② <b>平假名</b>（圓圓的，例：おねがい）用來寫日文原本的詞。<br>
③ <b>小字</b>：小 ッ＝停一拍；小 ャュョェ 跟前一個字合在一起念（チ＋ェ＝che）。
</div>

<div id="list"></div>

<script>
const S=[
 {"sec": "🏨 第 1 幕：早上退房、寄放行李（06:45）"},
 {"zh": "我要退房", "jp": "チェックアウト、お願いします", "k": "チェ:che ッ:· ク:ku ア:a ウ:u ト:to | お:o ね:ne が:ga い:i し:shi ま:ma す:su", "say": "切‧酷阿烏偷，喔內該西媽斯", "tip": "第 1 課的チェックイン 換成 アウト 就好。"},
 {"zh": "行李可以寄放到下午嗎？", "jp": "荷物を午後まで預かってもらえますか？", "k": "に:ni も:mo つ:tsu を:o | ご:go ご:go ま:ma で:de | あ:a ず:zu か:ka っ:· て:te | も:mo ら:ra え:e ま:ma す:su か:ka", "say": "你摸刺 喔，狗狗媽爹，阿茲卡‧貼 摸拉欸媽斯卡？", "tip": "荷物＝行李。預かる＝幫忙保管。拿到寄物牌記得拍照。"},
 {"sec": "🏃 第 2 幕：馬拉松會場"},
 {"zh": "寄放行李的地方在哪？", "jp": "手荷物預けはどこですか？", "k": "て:te に:ni も:mo つ:tsu | あ:a ず:zu け:ke は:wa | ど:do こ:ko で:de す:su か:ka", "say": "貼你摸刺 阿茲給 哇，兜口 爹斯卡？", "tip": "手荷物預け＝寄放隨身行李（會場招牌就寫這幾個字）。"},
 {"zh": "更衣室在哪？", "jp": "更衣室はどこですか？", "k": "こ:ko う:u い:i し:shi つ:tsu は:wa | ど:do こ:ko で:de す:su か:ka", "say": "扣ー依西刺 哇，兜口 爹斯卡？", "tip": "跟 トイレはどこですか 同一個句型，只換地點。"},
 {"zh": "（聽懂觀眾喊）加油！", "jp": "がんばって！", "k": "が:ga ん:n ば:ba っ:· て:te", "say": "乾‧巴‧貼！", "tip": "沿路一直會聽到。回一句「ありがとう！」或揮手就好。"},
 {"zh": "腳好痛（找醫護）", "jp": "足が痛いです", "k": "あ:a し:shi が:ga | い:i た:ta い:i で:de す:su", "say": "阿西嘎，依他依 爹斯", "tip": "足＝腳，痛い＝痛。把 足 換成 お腹（おなか，肚子）、頭（あたま）也能用。"},
 {"zh": "我跑完了！", "jp": "完走しました！", "k": "か:ka ん:n そ:so う:u | し:shi ま:ma し:shi た:ta", "say": "砍搜ー 西媽西他！", "tip": "完走＝跑完全程。跟會合的家人、或終點的志工說都可以。"},
 {"sec": "📦 第 3 幕：下午入住、寄宅急便（16:30）"},
 {"zh": "我來拿早上寄放的行李", "jp": "預けた荷物をお願いします", "k": "あ:a ず:zu け:ke た:ta | に:ni も:mo つ:tsu を:o | お:o ね:ne が:ga い:i し:shi ま:ma す:su", "say": "阿茲給他 你摸刺 喔，喔內該西媽斯", "tip": "同時把寄物牌拿給櫃台看。"},
 {"zh": "我想寄到大阪的飯店", "jp": "大阪のホテルに送りたいです", "k": "お:o お:o さ:sa か:ka の:no | ホ:ho テ:te ル:ru に:ni | お:o く:ku り:ri た:ta い:i で:de す:su", "say": "喔ー撒卡 no，齁貼嚕 你，喔酷里他依 爹斯", "tip": "〜たいです＝我想〜。送る＝寄送。地址給店員看 app 的「給黑貓看」卡。"},
 {"zh": "請在 16 號送到", "jp": "16日に届けてください", "k": "じゅう:jū ろ:ro く:ku に:ni ち:chi に:ni | と:to ど:do け:ke て:te | く:ku だ:da さ:sa い:i", "say": "久‧摟酷‧你七 你，偷兜給貼 酷搭撒依", "tip": "日期＝數字＋にち（例外：1日 ついたち、20日 はつか）。"},
 {"sec": "🔥 第 4 幕：石田屋 燒肉（19:00）＋港塔"},
 {"zh": "我們訂了 19 點，姓林", "jp": "19時に予約した、リンです", "k": "じゅう:jū く:ku じ:ji に:ni | よ:yo や:ya く:ku し:shi た:ta | リ:ri ン:n で:de す:su", "say": "久‧酷‧吉 你，喲呀酷西他，林‧爹斯", "tip": "19時 念 じゅうくじ（9 點的 9 念 く，不念 きゅう）。"},
 {"zh": "乾杯！", "jp": "乾杯！", "k": "か:ka ん:n ぱ:pa い:i", "say": "砍趴依！", "tip": "跑完全馬的慶功宴，大聲一點！"},
 {"zh": "可以幫我們換烤網嗎？", "jp": "網を替えてください", "k": "あ:a み:mi を:o | か:ka え:e て:te | く:ku だ:da さ:sa い:i", "say": "阿咪 喔，卡欸貼 酷搭撒依", "tip": "網＝烤網。網子焦黑了就舉手說：すみません、網を替えてください。"},
 {"zh": "（計程車）請到港塔", "jp": "ポートタワーまでお願いします", "k": "ポ:po ー:~ ト:to タ:ta ワ:wa ー:~ | ま:ma で:de | お:o ね:ne が:ga い:i し:shi ま:ma す:su", "say": "剖ー偷 他哇ー 媽爹，喔內該西媽斯", "tip": "〜までお願いします＝請載我到〜。任何地點都能套。"},
];
let n=0;const L=document.getElementById('list');let a=new Audio();
for(const s of S){
 if(s.sec){L.insertAdjacentHTML('beforeend',`<h2>${s.sec}</h2>`);continue}
 n++;const id=String(n).padStart(2,'0');
 const kana=s.k.split(' ').map(t=>t==='|'?'<span style="width:8px"></span>':(([c,r])=>`<span class="k${/^[ァィゥェォッャュョ]$|ッ/.test(c)&&c.length===1?' small':''}"><b>${c}</b><i>${r}</i></span>`)(t.split(':'))).join('');
 L.insertAdjacentHTML('beforeend',`<div class="card"><div class="zh">${n}. ${s.zh}</div><div class="jp">${s.jp}</div><div class="kana">${kana}</div><div class="say">🗣 ${s.say}</div><div class="btns"><button class="slow" onclick="p('${id}-slow')">🐢 慢</button><button onclick="p('${id}-norm')">▶ 正常</button></div><div class="tip">${s.tip}</div></div>`);
}
function p(f){a.pause();a=new Audio(f+'.m4a');a.play()}
</script>
<p style="text-align:center;margin:24px 0 32px;font-size:16px"><a href="../day1/">第 1 課</a>　｜　<a href="../day2/">第 2 課</a>　｜　<a href="../day3/">第 3 課</a></p>
</body>
</html>
